# Reek configuration
# The lexer is inherently complex and table-driven; exclude it from high-churn detectors.
# Core parser/evaluator/unifier paths are algorithmic and currently exceed Reek thresholds;
# suppress targeted detectors to keep the signal actionable until a deeper refactor.
# TODO(2026-02-09): Narrow these exclusions as evaluator/parser refactors progress.

detectors:
  TooManyMethods:
    exclude:
      # Recursive-descent JSON Schema validator: one predicate per keyword family.
      - Ruby::Rego::Builtins::Codecs::JsonSchema::Matcher
      - Ruby::Rego::Lexer
      - Ruby::Rego::Builtins::Times::GoLayout
      - Ruby::Rego::Parser
      - Ruby::Rego::Compiler
      - Ruby::Rego::Evaluator
      - Ruby::Rego::Evaluator::ReferenceResolver
      - Ruby::Rego::Evaluator::RuleEvaluator
      - Ruby::Rego::Unifier
  TooManyConstants:
    exclude:
      - Ruby::Rego::Lexer
      - Ruby::Rego::Builtins::Times::GoLayout
      - Ruby::Rego::Evaluator::OperatorEvaluator
      # Regex carries several independent anti-DoS bound constants (timeout, source
      # length, output/work caps) plus character classes — each a distinct guard.
      - Ruby::Rego::Builtins::Regex
      # yaml.v2 emitter port: scalar-style constants plus the two quote-trigger regexes.
      - Ruby::Rego::Builtins::Yaml::Emitter
      # Resolver carries the yaml.v2 resolve map/regex plus distinct anti-DoS bounds.
      - Ruby::Rego::Builtins::Yaml::ScalarResolver
      # Two multiplier tables (SI/binary) plus the exponent bound and numeric-scan constants.
      - Ruby::Rego::Builtins::Units
      # Go enum tables (EKU), name-constraint/access-method maps, the recognized-OID list, and the
      # depth / int64 DoS bounds — each an independent crypto/x509 constant.
      - Ruby::Rego::Builtins::Crypto::CertificateStruct
      # One regex per gojsonschema format checker (hostname/uuid/json-pointer/date/time/rfc3339) — distinct
      # ported patterns, plus the shared hostname-label fragment.
      - Ruby::Rego::Builtins::Codecs::JsonSchema::Formats
  TooManyInstanceVariables:
    exclude:
      - Ruby::Rego::Lexer
      - Ruby::Rego::Builtins::Times::GoLayout
      - Ruby::Rego::Evaluator
      - Ruby::Rego::Evaluator::ReferenceResolver
  TooManyStatements:
    exclude:
      # Faithful ports of Go's regexp match/split iteration (adjacency filter,
      # keep-trailing / zero-width rules).
      - Ruby::Rego::Builtins::Regex#self.each_match
      - Ruby::Rego::Builtins::Regex#self.split_segments
      - Ruby::Rego::Builtins::Regex#self.replace
      # Char-scanning port of Go's regexp.Expand replacement-template parser.
      - Ruby::Rego::Builtins::Regex::GoTemplate
      # Faithful port of the gintersect glob-intersection library (tokenizer +
      # recursive intersection engine); inherently statement-heavy.
      - Ruby::Rego::Builtins::Regex::GlobIntersection
      - Ruby::Rego::Builtins::Regex::GlobIntersection::Intersector
      # Recursive JSON normalization: type-dispatch case fold.
      - Ruby::Rego::Builtins::Codecs#self.jsonify
      # Faithful port of OPA's arraySetSubset unmatched-counter (==-based for numeric equality).
      - Ruby::Rego::Builtins::Collections::ObjectOps#self.array_set_subset?
      # cidr_contains_matches: parse both operands then cross-product; entries: 4-way
      # collection-or-scalar dispatch.
      - Ruby::Rego::Builtins::Net#self.cidr_contains_matches
      - Ruby::Rego::Builtins::Net#self.entries
      # Faithful SemVer parse / §11 precedence steps.
      - Ruby::Rego::Builtins::Semver#self.build_version
      - Ruby::Rego::Builtins::Semver#self.compare_prerelease
      - Ruby::Rego::Builtins::Semver#self.compare_identifier
      # Multi-index array removal: recurse-then-delete-descending in one pass.
      - Ruby::Rego::Builtins::JsonPaths#self.prune_array
      # Faithful ports of the yaml.v2 emitter and scalar resolver.
      - Ruby::Rego::Builtins::Yaml::Emitter
      - Ruby::Rego::Builtins::Yaml::ScalarResolver
      # Re-derivation of Go crypto/x509's parseCertificate extension parsers + net.IP.String, each a
      # statement-heavy faithful port (ASN.1 walks, the SAN/nameConstraints/policy field builders).
      - Ruby::Rego::Builtins::Crypto::CertificateStruct
      # Concatenated-DER cert splitter (decode-len-advance loop with a parse guard).
      - Ruby::Rego::Builtins::Crypto#self.der_certificates
      # PEM cert collector: OPA's getX509CertsFromPem (empty/non-cert-block rejection per block).
      - Ruby::Rego::Builtins::Crypto#self.pem_certificates
      # Recursive term-order comparator (single case over all value types).
      - Ruby::Rego::Builtins::TermOrder
      # Recursive canonicalizer (single case over all value types) for OPA number equality.
      - Ruby::Rego::Value#self.canonicalize
      # Graph traversal: BFS worklist and the recursive path builder (OPA reachable port).
      - Ruby::Rego::Builtins::Graph#self.walk_reachable
      - Ruby::Rego::Builtins::Graph#self.reachable_paths
      - Ruby::Rego::Builtins::Graph#self.build_paths
      - Ruby::Rego::Lexer
      - Ruby::Rego::Builtins::Times::GoLayout
      - Ruby::Rego::Parser
      - Ruby::Rego::CompiledPolicySet
      - Ruby::Rego::Evaluator
      - Ruby::Rego::Evaluator::ReferenceResolver
      - Ruby::Rego::Evaluator::RuleEvaluator
      - Ruby::Rego::Evaluator::OperatorEvaluator
      - Ruby::Rego::Unifier
      - Ruby::Rego::WithModifiers::WithModifierBuiltinOverride
      - Ruby::Rego::ParserError#initialize
      - Ruby::Rego::TypeError#initialize
      - Ruby::Rego::UnificationError#initialize
  DataClump:
    exclude:
      # The recursive validator threads (document, subschema) through every keyword predicate — the
      # clump IS the recursion, not an extractable type.
      - Ruby::Rego::Builtins::Codecs::JsonSchema::Matcher
  DuplicateMethodCall:
    exclude:
      # Recursive canonicalizer reuses canonicalize_each across the array/set case arms.
      - Ruby::Rego::Value#self.canonicalize
      - Ruby::Rego::Lexer
      - Ruby::Rego::Builtins::Times::GoLayout
      - Ruby::Rego::Evaluator
      - Ruby::Rego::Evaluator::ReferenceResolver
      - Ruby::Rego::Evaluator::RuleEvaluator
      - Ruby::Rego::Unifier
      - Ruby::Rego::WithModifiers::WithModifierBuiltinOverride
      # Character-scanning glob->regex compiler; repeated index arithmetic is inherent.
      - Ruby::Rego::Builtins::Glob::GlobCompiler
      # Char-scanning port of Go's regexp.Expand replacement-template parser.
      - Ruby::Rego::Builtins::Regex::GoTemplate
      # gintersect port: repeated rune/token index access while scanning.
      - Ruby::Rego::Builtins::Regex::GlobIntersection
      - Ruby::Rego::Builtins::Regex::GlobIntersection::Intersector
      # yaml.v2 emitter/resolver: repeated scalar/index access while building nodes.
      - Ruby::Rego::Builtins::Yaml::Emitter
      - Ruby::Rego::Builtins::Yaml::ScalarResolver
      # Recursive term-order comparator: repeats sort_key across case branches.
      - Ruby::Rego::Builtins::TermOrder
      # x509 field builders: two maps over the parsed-URI list / a zero-run span compared each step.
      - Ruby::Rego::Builtins::Crypto::CertificateStruct
  ManualDispatch:
    exclude:
      # Walks heterogeneous OpenSSL::ASN1 nodes whose element types vary (constructed vs primitive,
      # context-tagged), so respond_to?(:tag)/(:tag_class) guards are inherent, not a code smell.
      - Ruby::Rego::Builtins::Crypto::CertificateStruct
  UtilityFunction:
    exclude:
      # match_schema's keyword predicates are pure checks over the (document, schema) it recurses on.
      - Ruby::Rego::Builtins::Codecs::JsonSchema::Matcher
      - Ruby::Rego::Lexer
      - Ruby::Rego::Builtins::Times::GoLayout
      - Ruby::Rego::Evaluator
      - Ruby::Rego::Evaluator::ReferenceResolver
      - Ruby::Rego::Unifier
      # Module-merge helpers (parse_source, merge_imports) are pure AST transforms.
      - Ruby::Rego::Compiler
      # Pure helpers of the Go Expand template parser (extract/reference/named_submatch).
      - Ruby::Rego::Builtins::Regex::GoTemplate
  FeatureEnvy:
    exclude:
      # The validator inherently operates on the document/subschema it is handed, not on instance state.
      - Ruby::Rego::Builtins::Codecs::JsonSchema::Matcher
      - Ruby::Rego::Lexer
      - Ruby::Rego::Builtins::Times::GoLayout
      - Ruby::Rego::Evaluator::RuleEvaluator
      - Ruby::Rego::Evaluator::ReferenceKeyResolver
      - Ruby::Rego::Evaluator::BoundVariableCollector
      - Ruby::Rego::Unifier
      # Module-merge helpers (merge_group, merge_modules_by_package) operate over AST groups.
      - Ruby::Rego::Compiler
      # Package-key indexing builds a local accumulator over the module list.
      - Ruby::Rego::CompiledPolicySet
      # The Go Expand template parser scans into local literal/segment accumulators.
      - Ruby::Rego::Builtins::Regex::GoTemplate
      # gintersect intersection engine walks the glob/other token arrays.
      - Ruby::Rego::Builtins::Regex::GlobIntersection::Intersector
  ControlParameter:
    exclude:
      - Ruby::Rego::Lexer
      - Ruby::Rego::Builtins::Times::GoLayout
      - Ruby::Rego::Evaluator::RuleEvaluator
      - Ruby::Rego::Unifier
      - Ruby::Rego::WithModifiers::WithModifierBuiltinOverride
      # resolve dispatches on the segment kind produced by the template parser.
      - Ruby::Rego::Builtins::Regex::GoTemplate
      # atom_token dispatches on whether the rune was backslash-escaped.
      - Ruby::Rego::Builtins::Regex::GlobIntersection
      # Emitter.scalar dispatches on the requested scalar style.
      - Ruby::Rego::Builtins::Yaml::Emitter
      # merge_key? dispatches on whether the resolved key is the merge token.
      - Ruby::Rego::Builtins::Yaml::ScalarResolver
      # x509 builders dispatch on the GeneralName/OID/ASN.1 tag — a faithful port of crypto/x509.
      - Ruby::Rego::Builtins::Crypto::CertificateStruct
  NilCheck:
    exclude:
      - Ruby::Rego::Lexer
      - Ruby::Rego::Builtins::Times::GoLayout
      - Ruby::Rego::Evaluator::ReferenceResolver
      - Ruby::Rego::Unifier
      - Ruby::Rego::Builtins::Regex::GoTemplate
      # Nil sentinels for trim mismatch and the star's optional next-token.
      # Type-dispatch over JSON values (null is a real case).
      - Ruby::Rego::Builtins::Yaml::Emitter
      - Ruby::Rego::Builtins::Yaml::ScalarResolver
      - Ruby::Rego::Builtins::Regex::GlobIntersection
      - Ruby::Rego::Builtins::Regex::GlobIntersection::Intersector
  LongParameterList:
    exclude:
      # gintersect tokenizer threads (chars, index, +context) through its scan helpers.
      - Ruby::Rego::Builtins::Regex::GlobIntersection
      # Recursive path builder threads (graph, root, path, accumulator, visited) like OPA's.
      - Ruby::Rego::Builtins::Graph#self.build_paths
      # The extension dispatcher threads (fields, oid, critical, der) to each crypto/x509 parser.
      - Ruby::Rego::Builtins::Crypto::CertificateStruct#self.dispatch_extension
      # The Raw* slices take the cert, tbs, and the three pre-located issuer/subject/spki elements.
      - Ruby::Rego::Builtins::Crypto::CertificateStruct#self.raw_fields
  Attribute:
    exclude:
      # Token#flag is set by the tokenizer and rewritten by Simplify (mirrors Go SetFlag).
      - Ruby::Rego::Builtins::Regex::GlobIntersection::Token
  RepeatedConditional:
    exclude:
      # Value wraps Ruby types, so it type-dispatches on `value` in several factory/canonical
      # helpers (build_simple_value, build_composite_value, canonicalize).
      - Ruby::Rego::Value
      - Ruby::Rego::Lexer
      - Ruby::Rego::Builtins::Times::GoLayout
      - Ruby::Rego::Evaluator
      - Ruby::Rego::Evaluator::ReferenceResolver
      - Ruby::Rego::Evaluator::RuleEvaluator
  NestedIterators:
    exclude:
      - Ruby::Rego::Evaluator::RuleEvaluator
      # Idiomatic any-over-any membership test; short-circuits on both axes.
      - Ruby::Rego::Builtins::Strings#self.any_pair_match?
      # YAML merge keys: iterate merge sources, then each source's entries.
      - Ruby::Rego::Builtins::Yaml::ScalarResolver#self.merge_into
      # X.509 ASN.1 is nested SEQUENCE-OF: KeyUsage bits, RDN attributes, nameConstraints subtrees.
      - Ruby::Rego::Builtins::Crypto::CertificateStruct#self.key_usage
      - Ruby::Rego::Builtins::Crypto::CertificateStruct#self.name_constraints
      - Ruby::Rego::Builtins::Crypto::Name#self.build
  UncommunicativeVariableName:
    accept:
      - e
      - _
    exclude:
      - Ruby::Rego::Builtins::Collections::ObjectOps#self.object_remove
      - Ruby::Rego::Evaluator::ExpressionDispatch#handler_for
  UncommunicativeMethodName:
    exclude:
      # Hash-algorithm names (md5/sha1/sha256, and the keyed hmac_* variants) are
      # intrinsic OPA built-in names; the embedded digits are domain identifiers, not
      # poor naming.
      - Ruby::Rego::Builtins::Crypto#self.md5
      - Ruby::Rego::Builtins::Crypto#self.sha1
      - Ruby::Rego::Builtins::Crypto#self.sha256
      - Ruby::Rego::Builtins::Crypto#self.hmac_md5
      - Ruby::Rego::Builtins::Crypto#self.hmac_sha1
      - Ruby::Rego::Builtins::Crypto#self.hmac_sha256
      - Ruby::Rego::Builtins::Crypto#self.hmac_sha512
      # Go time.Parse field readers: the digits name the field width (getnum3/getnum4)
      # or the 12/24-hour clock (consume_hour12/24), mirroring Go's src/time/format.go.
      - Ruby::Rego::Builtins::Times::GoLayout::Parser#getnum3
      - Ruby::Rego::Builtins::Times::GoLayout::Parser#getnum4
      - Ruby::Rego::Builtins::Times::GoLayout::Parser#consume_year2
      - Ruby::Rego::Builtins::Times::GoLayout::Parser#consume_hour12
      - Ruby::Rego::Builtins::Times::GoLayout::Parser#consume_hour24
      # The OPA builtin name uuid.rfc4122 → rfc4122; the digits are the RFC number, not a count.
      - Ruby::Rego::Builtins::Uuid#self.rfc4122
      # Domain abbreviations: b64 = Base64 encode, rfc3339 = the RFC 3339 timestamp Go emits,
      # render_ipv6 = the IPv6 branch of net.IP.String (the digits name the IP version).
      - Ruby::Rego::Builtins::Crypto::CertificateStruct#self.b64
      - Ruby::Rego::Builtins::Crypto::CertificateStruct#self.rfc3339
      - Ruby::Rego::Builtins::Crypto::CertificateStruct#self.render_ipv6
      # b64 = the base64url (no-pad) JWS-segment encoder.
      - Ruby::Rego::Builtins::Jwt#self.b64
